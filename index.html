<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>狂刀小可愛</title>
<style>
:root{color-scheme:light;--task:42px;--silver:#c0c0c0;--blue:#000080;--out:inset 1px 1px #fff,inset -1px -1px #101010,inset 2px 2px #dfdfdf,inset -2px -2px #808080;--in:inset 1px 1px #808080,inset -1px -1px #fff;font:14px Tahoma,"Microsoft JhengHei","PingFang TC",sans-serif}
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#008080;color:#111}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:2px dotted currentColor;outline-offset:-5px}
#desktop{position:fixed;inset:0 0 calc(var(--task) + env(safe-area-inset-bottom)) 0;overflow:hidden}
#pet{position:absolute;width:124px;height:92px;border:0;background:none;margin:0;padding:0;left:0;top:0;cursor:grab;touch-action:none;user-select:none;z-index:2}
#pet[data-grabbed=true]{cursor:grabbing}#sprite{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;pointer-events:none}
#speech{position:absolute;left:0;top:0;z-index:3;max-width:calc(100% - 16px);padding:8px 12px;background:#ffffd2;border:1px solid #121212;box-shadow:2px 2px rgba(0,0,0,.3);white-space:pre-line;pointer-events:none}
#bar{position:fixed;z-index:4;bottom:0;left:0;right:0;height:calc(var(--task) + env(safe-area-inset-bottom));padding:5px 6px calc(5px + env(safe-area-inset-bottom));display:flex;gap:6px;align-items:stretch;background:var(--silver);border-top:2px solid white}
.win-button{background:var(--silver);border:0;box-shadow:var(--out);padding:5px 11px;white-space:nowrap}
.win-button:active,.win-button[aria-expanded=true]{box-shadow:var(--in)}
#menu-toggle{text-align:left;min-width:124px;font-weight:bold}.separator{border-left:1px solid #888;border-right:1px solid #e8e8e8;margin:2px 0}
#hint{align-self:center;color:#2e2e2e;font-size:12px;line-height:1.25}
#clock{margin-left:auto;display:grid;place-items:center;min-width:66px;box-shadow:var(--in);font-variant-numeric:tabular-nums;padding-inline:7px}
#menu{position:fixed;z-index:5;min-width:164px;max-width:calc(100vw - 12px);background:var(--silver);box-shadow:var(--out);padding:4px}
#menu button{display:block;text-align:left;width:100%;border:0;background:none;padding:8px 12px}
#menu button:is(:hover,:focus-visible){background:var(--blue);color:white}
#menu hr{border:none;border-top:1px solid #878787;border-bottom:1px solid #fff;margin:3px 4px}
dialog{color:inherit;background:var(--silver);border:0;padding:4px;width:min(290px,calc(100vw - 24px));box-shadow:var(--out);z-index:6}
dialog::backdrop{background:rgba(0,40,40,.18)}
.title{background:var(--blue);color:white;line-height:24px;padding:0 7px;font-weight:bold}.dialog-content{padding:13px 10px;text-align:center}.dialog-content p{margin:9px 0 12px}.choices{display:flex;justify-content:center;gap:9px;margin-top:13px}.choices button{min-width:74px}.logo{display:block;width:80px;height:48px;margin:2px auto 0;image-rendering:pixelated}
.open-in-browser{position:fixed;z-index:7;left:50%;top:38%;transform:translate(-50%,-50%);width:min(360px,calc(100% - 24px));margin:0;padding:16px;background:var(--silver);box-shadow:var(--out)}
[hidden]{display:none!important}
@media(max-width:420px){#hint{font-size:11px}#menu-toggle{min-width:0;padding-inline:7px}#clock{min-width:56px}}
</style>
</head>
<body>
<noscript><p class="open-in-browser">請下載這個 HTML 檔，直接用 Safari 或 Chrome 開啟，即可讓狂刀走動。</p></noscript>
<main id="desktop" aria-label="桌面">
  <button id="pet" aria-label="狂刀，點一下互動，按住拖曳"><img id="sprite" alt="" draggable="false"></button>
  <div id="speech" role="status" hidden></div>
</main>
<div id="bar">
  <button type="button" id="menu-toggle" class="win-button" aria-controls="menu" aria-expanded="false">狂刀小可愛</button>
  <span class="separator" aria-hidden="true"></span>
  <span id="hint">點一下狂刀，或拖他到別處</span>
  <time id="clock"></time>
</div>
<nav id="menu" aria-label="狂刀小可愛功能" hidden>
  <button type="button" data-action="roam">暫停走動</button>
  <button type="button" data-action="emote">表演動作</button>
  <button type="button" data-action="talk">狂刀說話</button>
  <hr>
  <button type="button" data-action="settings">設定</button>
</nav>
<dialog id="settings" aria-labelledby="dialog-title">
  <div class="title" id="dialog-title">狂刀小可愛</div>
  <div class="dialog-content">
    <img class="logo" id="logo" alt="SOFTSTAR">
    <p>狂刀小可愛</p>
    <label><input type="checkbox" id="voice" checked> 語音</label>
    <div class="choices">
      <button type="button" class="win-button" id="continue" autofocus>繼續</button>
      <button type="button" class="win-button" id="exit">結束</button>
    </div>
  </div>
</dialog>

<script>
'use strict';
const {frames, audio} = JSON.parse(document.querySelector('#original-assets').textContent);
const desktop = document.querySelector('#desktop');
const pet = document.querySelector('#pet');
const sprite = document.querySelector('#sprite');
const menu = document.querySelector('#menu');
const menuToggle = document.querySelector('#menu-toggle');
const settings = document.querySelector('#settings');
const voice = document.querySelector('#voice');
const speech = document.querySelector('#speech');
const hint = document.querySelector('#hint');
const clock = document.querySelector('#clock');
const logo = document.querySelector('#logo');
const range = (prefix, first, count) => Array.from({length: count}, (_, index) => prefix + (index + first));
const animations = {
  stand: ['STAND1'], catch: range('CATCH', 1, 5), shake: range('SHACK', 1, 5), emote: range('EMO', 1, 20),
  walkRight: range('WD1', 1, 7), walkLeft: range('WD2', 1, 7),
  walkBackLeft: range('WD', 1, 7), walkBackRight: range('WD3', 1, 7),
  runRight: range('RD1', 1, 4), runLeft: range('RD2', 1, 4),
  runBackLeft: range('RD0', 1, 4), runBackRight: range('RD3', 1, 4)
};
const lines = ['.....', '我很累..不要玩我', '我要找慕容蟬\n沒時間和你玩'];
const speechClips = ['TV1', 'TV2', 'TV3'];
const images = new Map();
for (const name of new Set(Object.values(animations).flat())) {
  const image = new Image();
  image.src = frames[name];
  images.set(name, image);
}
logo.src = frames['157'];

let x = 0, y = 0, destination = null, dragging = null;
let mode = 'stand', modeStart = performance.now(), nextMove = 0;
let lastTick = modeStart, lastFrame = '', talkIndex = 0, lastClick = -Infinity;
let walking = true, running = true, currentAudio = null, speechTimeout;
let menuAnchor = null;
try { voice.checked = localStorage.getItem('crazy-blade-voice') !== 'off'; } catch {}

const clamp = (value, max) => Math.min(Math.max(0, value), Math.max(0, max));
function place(newX, newY) {
  x = clamp(newX, desktop.clientWidth - pet.offsetWidth);
  y = clamp(newY, desktop.clientHeight - pet.offsetHeight);
  pet.style.transform = 'translate3d(' + Math.round(x) + 'px,' + Math.round(y) + 'px,0)';
}
function positionSpeech() {
  const width = speech.offsetWidth;
  const height = speech.offsetHeight;
  const left = Math.max(8, Math.min(x + pet.offsetWidth / 2 - width / 2, desktop.clientWidth - width - 8));
  speech.style.transform = 'translate(' + left + 'px,' + (y >= height + 14 ? y - height - 8 : y + pet.offsetHeight + 4) + 'px)';
}
function playSound(name) {
  if (!voice.checked || !audio[name]) return;
  currentAudio?.pause();
  currentAudio = new Audio(audio[name]);
  currentAudio.play().catch(() => {});
}
function setMode(name, now = performance.now()) {
  mode = name;
  modeStart = now;
}
function settle(now = performance.now()) {
  destination = null;
  nextMove = now + 1100 + Math.random() * 1600;
  setMode('stand', now);
}
function interact(name) {
  if (!running || dragging) return;
  destination = null;
  if (name === 'talk') {
    const index = talkIndex++ % lines.length;
    speech.textContent = lines[index];
    speech.hidden = false;
    positionSpeech();
    clearTimeout(speechTimeout);
    speechTimeout = setTimeout(() => { speech.hidden = true; }, 3100);
    playSound(speechClips[index]);
    setMode('emote');
    return;
  }
  playSound('WAV2');
  setMode(name === 'shake' ? 'shake' : 'emote');
}
function startWander(now) {
  const maxX = Math.max(0, desktop.clientWidth - pet.offsetWidth);
  const maxY = Math.max(0, desktop.clientHeight - pet.offsetHeight);
  const dx = (100 + Math.random() * 145) * (x > maxX * .62 ? -1 : x < maxX * .38 ? 1 : Math.random() < .5 ? -1 : 1);
  const dy = (12 + Math.random() * 62) * (Math.random() < .4 ? -1 : 1);
  const toX = clamp(x + dx, maxX);
  const toY = clamp(y + dy, maxY);
  const prefix = Math.random() < .23 ? 'run' : 'walk';
  const side = toX < x ? 'Left' : 'Right';
  const back = toY < y - 28 && Math.abs(toX - x) < 140;
  destination = {x: toX, y: toY, speed: prefix === 'run' ? 116 : 62};
  setMode(prefix + (back ? 'Back' : '') + side, now);
}
function draw(now) {
  const dt = Math.max(0, Math.min(50, now - lastTick)) / 1000;
  lastTick = now;
  const active = running && !settings.open && menu.hidden;
  if (active && destination) {
    const dx = destination.x - x, dy = destination.y - y;
    const distance = Math.hypot(dx, dy), advance = dt * destination.speed;
    if (distance <= advance) {
      place(destination.x, destination.y);
      settle(now);
    } else {
      place(x + dx * advance / distance, y + dy * advance / distance);
    }
  }
  if (active && walking && !dragging && mode === 'stand' && now >= nextMove) startWander(now);
  const duration = mode.startsWith('run') ? 95 : mode === 'emote' ? 84 : 115;
  const sequence = animations[mode];
  let index = Math.max(0, Math.floor((now - modeStart) / duration));
  if (mode === 'catch') index = Math.min(index, sequence.length - 1);
  else if ((mode === 'shake' || mode === 'emote') && index >= sequence.length) {
    settle(now);
    index = 0;
  }
  const current = animations[mode][index % animations[mode].length];
  if (current !== lastFrame && images.get(current).complete) {
    sprite.src = images.get(current).src;
    lastFrame = current;
  }
  if (!speech.hidden) positionSpeech();
  requestAnimationFrame(draw);
}

pet.addEventListener('pointerdown', event => {
  if (!event.isPrimary || event.button !== 0) return;
  closeMenu();
  dragging = {id: event.pointerId, startX: event.clientX, startY: event.clientY, x, y, moved: false};
  destination = null;
  pet.setPointerCapture(event.pointerId);
});
pet.addEventListener('pointermove', event => {
  if (!dragging || event.pointerId !== dragging.id) return;
  const mx = event.clientX - dragging.startX, my = event.clientY - dragging.startY;
  if (!dragging.moved && Math.hypot(mx, my) < 5) return;
  if (!dragging.moved) {
    dragging.moved = true;
    pet.dataset.grabbed = 'true';
    setMode('catch');
  }
  place(dragging.x + mx, dragging.y + my);
});
function finishGrab(event, canceled = false) {
  if (!dragging || event.pointerId !== dragging.id) return;
  const moved = dragging.moved;
  dragging = null;
  delete pet.dataset.grabbed;
  if (canceled) { settle(); return; }
  const now = performance.now();
  if (moved) interact('shake');
  else {
    interact(now - lastClick < 450 ? 'talk' : 'emote');
    lastClick = now;
  }
}
pet.addEventListener('pointerup', event => finishGrab(event));
pet.addEventListener('pointercancel', event => finishGrab(event, true));
pet.addEventListener('lostpointercapture', event => finishGrab(event, true));
pet.addEventListener('click', event => { if (event.detail === 0) interact('emote'); });
pet.addEventListener('contextmenu', event => {
  event.preventDefault();
  openMenu(event.clientX, event.clientY);
});

function openMenu(left, top) {
  if (!running) { resume(); return; }
  menu.hidden = false;
  menuToggle.setAttribute('aria-expanded', 'true');
  const barTop = document.querySelector('#bar').getBoundingClientRect().top;
  const width = menu.offsetWidth, height = menu.offsetHeight;
  menu.style.left = Math.max(5, Math.min(left, innerWidth - width - 5)) + 'px';
  menu.style.top = Math.max(4, Math.min(top - height, barTop - height - 3)) + 'px';
  menuAnchor = document.activeElement;
  menu.querySelector('button').focus();
}
function closeMenu(restore = false) {
  if (menu.hidden) return;
  menu.hidden = true;
  menuToggle.setAttribute('aria-expanded', 'false');
  if (restore) menuAnchor?.focus();
}
menuToggle.addEventListener('click', () => {
  if (!menu.hidden) closeMenu(true);
  else openMenu(6, menuToggle.getBoundingClientRect().top - 6);
});
document.addEventListener('pointerdown', event => {
  if (!menu.contains(event.target) && !menuToggle.contains(event.target)) closeMenu();
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && !menu.hidden) closeMenu(true);
});
const roamButton = menu.querySelector('[data-action=roam]');
function updateRoam() { roamButton.textContent = walking ? '暫停走動' : '恢復走動'; }
menu.addEventListener('click', event => {
  const action = event.target.closest('button')?.dataset.action;
  if (!action) return;
  closeMenu(true);
  if (action === 'roam') {
    walking = !walking;
    settle();
    if (walking) nextMove = 0;
    updateRoam();
  }
  else if (action === 'settings') settings.showModal();
  else interact(action);
});
voice.addEventListener('change', () => {
  if (!voice.checked) currentAudio?.pause();
  try { localStorage.setItem('crazy-blade-voice', voice.checked ? 'on' : 'off'); } catch {}
});
document.querySelector('#continue').addEventListener('click', () => settings.close());
settings.addEventListener('close', () => { if (running) settle(); });
document.querySelector('#exit').addEventListener('click', () => {
  running = false;
  currentAudio?.pause();
  settings.close();
  pet.hidden = true;
  speech.hidden = true;
  hint.textContent = '已結束。按「狂刀小可愛」重新開啟。';
});
function resume() {
  running = true;
  pet.hidden = false;
  hint.textContent = '點一下狂刀，或拖他到別處';
  settle();
  nextMove = 0;
  place(x, y);
  playSound('WAV3');
}
function updateClock() {
  const now = new Date();
  clock.textContent = now.toLocaleTimeString('zh-TW', {hour: '2-digit', minute: '2-digit', hour12: false});
  clock.dateTime = now.toISOString();
}
window.addEventListener('resize', () => { closeMenu(); settle(); place(x, y); });
updateRoam();
updateClock();
setInterval(updateClock, 1000);
sprite.src = frames.STAND1;
place(desktop.clientWidth * .56 - pet.offsetWidth / 2, desktop.clientHeight * .64 - pet.offsetHeight / 2);
requestAnimationFrame(draw);
</script>
</body>
